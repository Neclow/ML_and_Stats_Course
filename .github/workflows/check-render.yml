name: Render Check

on:
  pull_request:
    paths:
      - "chapters/**"
      - "advanced/**"
      - "_quarto.yml"
      - "references.bib"
      - "_freeze/**"
      - "solutions/**"
      - ".github/workflows/check-render.yml"

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          environments: book

      - run: pixi run -e book easy_render
